<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Email verified | FloodWatch</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: #17324d;
      background: #eaf5fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 12%, rgba(54, 169, 225, .18), transparent 32rem),
        linear-gradient(145deg, #f6fbfe 0%, #dceff8 100%);
    }

    main {
      width: min(100%, 460px);
      padding: 38px 32px 32px;
      text-align: center;
      background: rgba(255, 255, 255, .96);
      border: 1px solid rgba(24, 101, 142, .12);
      border-radius: 24px;
      box-shadow: 0 22px 60px rgba(27, 82, 112, .16);
    }

    .logo {
      width: 86px;
      height: 86px;
      border-radius: 22px;
      object-fit: cover;
      box-shadow: 0 10px 26px rgba(20, 116, 166, .18);
    }

    .check {
      width: 58px;
      height: 58px;
      margin: 22px auto 16px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      font-size: 32px;
      font-weight: 800;
      background: #15966c;
      box-shadow: 0 8px 20px rgba(21, 150, 108, .25);
    }

    .check.error {
      background: #c44747;
      box-shadow: 0 8px 20px rgba(196, 71, 71, .22);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 7vw, 2.2rem);
      line-height: 1.15;
      color: #123a55;
    }

    p {
      margin: 14px auto 0;
      max-width: 34ch;
      color: #587083;
      line-height: 1.6;
    }

    .button {
      width: 100%;
      margin-top: 26px;
      padding: 14px 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background: #1679ad;
      font: inherit;
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(22, 121, 173, .24);
    }

    .button:hover { background: #116b9a; }
    .button:focus-visible { outline: 3px solid #8bd2f5; outline-offset: 3px; }

    .hint {
      margin-top: 16px;
      font-size: .86rem;
      color: #7890a0;
    }

    .desktop-only { display: none; }

    @media (min-width: 700px) {
      .android-only { display: none; }
      .desktop-only { display: block; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <img class="logo" src="assets/floodwatch-logo.jpg" alt="FloodWatch logo">
    <div class="check" id="status-icon" aria-hidden="true">✓</div>
    <h1 id="page-title">Email verified!</h1>
    <p id="status-message">Your FloodWatch account has been confirmed. You can now return to the app and sign in.</p>

    <a class="button android-only" id="open-app" href="com.example.floodwatch://verify-email">
      Open FloodWatch
    </a>
    <p class="hint android-only">If the app does not open automatically, tap the button above.</p>
    <p class="hint desktop-only">You may close this page and sign in on your Android phone.</p>
  </main>

  <script>
    (() => {
      const isAndroid = /Android/i.test(navigator.userAgent);
      const appUrl = `com.example.floodwatch://verify-email${location.search}${location.hash}`;
      const openButton = document.getElementById("open-app");
      const query = new URLSearchParams(location.search);
      const fragment = new URLSearchParams(location.hash.replace(/^#/, ""));
      const error = query.get("error") || fragment.get("error");
      const errorDescription = query.get("error_description") ||
        fragment.get("error_description");

      if (error) {
        const statusIcon = document.getElementById("status-icon");
        statusIcon.classList.add("error");
        statusIcon.textContent = "!";
        document.getElementById("page-title").textContent = "Verification link unavailable";
        document.getElementById("status-message").textContent = errorDescription ||
          "This verification link is invalid or has expired. Please request a new email from FloodWatch.";
        openButton.style.display = "none";
        document.querySelectorAll(".hint").forEach(element => {
          element.textContent = "Return to FloodWatch and try again.";
        });
        return;
      }

      openButton.href = appUrl;

      // On Android, forward the Supabase callback to FloodWatch. The visible
      // button remains available in case the browser blocks automatic opening.
      if (isAndroid) {
        window.setTimeout(() => window.location.assign(appUrl), 1200);
      }
    })();
  </script>
</body>
</html>
